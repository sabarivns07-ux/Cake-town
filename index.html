
<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAKE TOWN - Stage 7</title>
<style>
body{font-family:Arial;margin:0;background:#fff7fb;color:#222}.wrap{max-width:520px;margin:auto;padding:16px}
h1{text-align:center;color:#d63384}.card{background:white;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 2px 8px #ddd}
input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:9px;border:1px solid #ddd}
button{background:#d63384;color:white;border:0;font-weight:bold}.item{display:flex;justify-content:space-between;gap:8px;align-items:center}.item button{width:80px}
#cart{font-weight:bold}.track{margin-top:12px;padding:12px;background:#f4f4f4;border-radius:10px}
</style></head><body><div class="wrap">
<h1>🍰 CAKE TOWN</h1>
<div class="card"><b>Table:</b> <span id="table"></span></div>
<div class="card">
<input id="name" placeholder="Customer Name">
<input id="phone" maxlength="10" placeholder="10-digit Phone Number" inputmode="numeric">
</div>
<div class="card">
<h3>Menu</h3>
<div class="item">Vennila ½ Kg ₹200 <button onclick="add('Vennila ½ Kg',200)">Add</button></div>
<div class="item">Chocolate ½ Kg ₹250 <button onclick="add('Chocolate ½ Kg',250)">Add</button></div>
<div class="item">Black Forest ½ Kg ₹250 <button onclick="add('Black Forest ½ Kg',250)">Add</button></div>
<div class="item">Redvelvet ½ Kg ₹450 <button onclick="add('Redvelvet ½ Kg',450)">Add</button></div>
</div>
<div class="card"><h3>Cart</h3><div id="cart">No items</div><button onclick="place()">Place Order</button></div>
<div class="card"><h3>Track Order</h3><input id="oid" placeholder="Enter Order No." inputmode="numeric"><button onclick="track()">Check Status</button><div id="status"></div></div>
</div>
<script>
const table=new URLSearchParams(location.search).get("table")||"01";document.getElementById("table").textContent=table;
let cart=[];
function add(n,p){let x=cart.find(i=>i.name===n);if(x)x.qty++;else cart.push({name:n,price:p,qty:1});render()}
function render(){document.getElementById("cart").innerHTML=cart.length?cart.map(i=>`${i.name} × ${i.qty} = ₹${i.price*i.qty}`).join("<br>")+"<hr>Total: ₹"+cart.reduce((s,i)=>s+i.price*i.qty,0):"No items"}
async function place(){
 let name=document.getElementById("name").value.trim(), phone=document.getElementById("phone").value.trim();
 if(!name||!/^\d{10}$/.test(phone)||!cart.length){alert("Enter name, valid 10-digit phone and select items.");return}
 let total=cart.reduce((s,i)=>s+i.price*i.qty,0);
 let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({table_no:table,customer_name:name,phone,items:JSON.stringify(cart),total})});
 let d=await r.json(); if(d.ok){document.getElementById("oid").value=d.order_id;alert("Order placed! Order No: "+d.order_id);cart=[];render();track()}
}
async function track(){let id=document.getElementById("oid").value;if(!id)return;let r=await fetch("/api/orders/"+id);let d=await r.json();if(d.error){status.innerHTML="Order not found";return}status.innerHTML="<div class='track'>Order #"+d.id+"<br>🪑 Table "+d.table_no+"<br><b>"+d.status+"</b></div>"}
</script></body></html>
